name: Supabase Keep-Alive Cron

on:
  schedule:
    # Jalan setiap 3 hari sekali (jam 00:00 UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          curl -s -f https://cepat-steel.vercel.app/api/health || echo "Ping failed, check URL deployment"
