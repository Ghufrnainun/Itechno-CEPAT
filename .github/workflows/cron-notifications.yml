name: Cron - Notification Digest

on:
  schedule:
    # Setiap 6 jam (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger kalau perlu

jobs:
  notification-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notifications" \
            --max-time 30 \
            || echo "Cron request failed, but workflow continues"
